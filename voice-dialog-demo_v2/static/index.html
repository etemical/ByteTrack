<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云端探索酒店前台语音 Demo v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e8ecf4; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  header { padding: 20px; text-align: center; }
  header h1 { font-size: 22px; font-weight: 600; }
  #status { margin-top: 6px; font-size: 13px; color: #8b93a7; }
  #status.on { color: #4ade80; }
  #wave { width: min(680px, 92vw); height: 56px; display: block; opacity: 0; transition: opacity .18s; }
  #wave.show { opacity: 1; }
  #transcript { width: min(680px, 92vw); flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #3d4a63 #141a28; }
  #transcript::-webkit-scrollbar { width: 6px; }
  #transcript::-webkit-scrollbar-track { background: #141a28; border-radius: 999px; }
  #transcript::-webkit-scrollbar-thumb { background: #3d4a63; border-radius: 999px; }
  #transcript::-webkit-scrollbar-thumb:hover { background: #5b6a86; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2563eb; border-bottom-right-radius: 4px; }
  .user.folded { max-width: 70%; padding: 6px 12px; font-size: 12px; line-height: 1.4; opacity: .5; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
  .user.folded:hover { opacity: .75; }
  .user.expandable { cursor: pointer; }
  .bot { align-self: flex-start; background: #1e2637; border-bottom-left-radius: 4px; }
  .partial { opacity: .55; font-style: italic; }
  .sys { align-self: center; background: none; color: #f59e0b; font-size: 12px; padding: 2px 8px; }
  #metrics { width: min(680px, 92vw); font-size: 12px; color: #8b93a7; padding: 6px 16px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  footer { width: min(680px, 92vw); padding: 16px; display: flex; justify-content: center; gap: 12px; }
  button { padding: 12px 32px; font-size: 16px; border: none; border-radius: 999px; cursor: pointer; transition: .15s; }
  #btnStart { background: #22c55e; color: #06210f; font-weight: 600; }
  #btnStart.stop { background: #ef4444; color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #playEl { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <h1>云端探索酒店前台语音 Demo v2</h1>
    <div id="status">未连接</div>
  </header>
  <canvas id="wave" width="680" height="56"></canvas>
  <div id="transcript"></div>
  <div id="metrics"></div>
  <footer>
    <button id="btnStart">开始对话</button>
  </footer>
  <audio id="playEl" autoplay playsinline></audio>
  <script src="/static/app.js?v=v2fold1"></script>
</body>
</html>
